name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      # Same browser-location strategy as playwright.yml: browsers stay under
      # node_modules/playwright-core/.local-browsers for both install and test.
      PLAYWRIGHT_BROWSERS_PATH: '0'
      # Inert placeholders so the build does not fail on missing Supabase env vars.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npx tsc --noEmit
    - name: Lint
      run: npm run lint
    - name: Restore Next.js build cache
      uses: actions/cache@v4
      with:
        path: .next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**','lib/**','components/**') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
          nextjs-${{ runner.os }}-
    - name: Build
      run: npm run build
    - name: Resolve Playwright version
      id: pw
      run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: node_modules/playwright-core/.local-browsers
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright smoke tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: Ostatní/playwright-report
        retention-days: 30
