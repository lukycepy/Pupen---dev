name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # PLAYWRIGHT_BROWSERS_PATH=0 keeps browsers inside node_modules/playwright-core/.local-browsers
    # so that both `playwright install` and `playwright test` resolve the same directory.
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Resolve Playwright version
      id: pw
      run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: node_modules/playwright-core/.local-browsers
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
    - name: Install Playwright Browsers
      # Config projects (chromium, mobile-chrome) both use Chromium, so Install chromium only.
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          Ostatní/playwright-report
          Ostatní/test-results
        retention-days: 30
